name: Desktop checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:runtime
      - run: npm test
      - run: npm run build
      - run: node scripts/desktop-smoke.cjs
      - run: npm run dist -- --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: trademe-windows-unsigned
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
